name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run rules and AI regression tests
        run: node tests/rules.test.mjs
      - name: Run transposition-table packing tests
        run: node tests/search.test.mjs
      - name: Check the worker command loop
        run: node tests/worker-inline.check.js
