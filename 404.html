<style>
    .missing {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        min-height: 100dvh;
        max-width: 680px;
        margin-inline: auto;
        padding: var(--s-300);
    }
    .missing .code {
        font-size: var(--text-xs);
        line-height: var(--lh-xs);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
    }
    .missing h1 {
        margin-top: var(--s-200);
        font-size: var(--text-4xl);
        line-height: var(--lh-4xl);
        font-weight: 700;
        background-image: linear-gradient(to right, var(--text-strong) 0%, var(--faint) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
    }
    .missing p {
        margin-top: var(--s-300);
        font-size: var(--text-lg);
        line-height: var(--lh-lg);

<body>
<main class="missing">
    <span class="code">404</span>
    <h1>This square is off the board</h1>
    <p>There is nothing at that address. The board is still where you left it, with your last game one click away.</p>
    <a class="btn btn-primary" href="./">Back to the board</a>
</main>
<script>
(function () {
    var saved = null;
    try { saved = localStorage.getItem('quoridor.theme'); } catch (e) { /* ignore */ }
    document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : 'auto';
})();
</script>
